<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bomb Busters — your wires</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <span class="display nav-brand"><span class="nav-dot" aria-hidden="true"></span> Bomb Busters</span>
  <button class="toggle" id="theme-toggle" aria-label="Toggle theme">Dark mode</button>
</nav>

<main>
  <div id="turn-banner" class="turn-banner turn-banner--waiting">
    <div id="turn-banner-label" class="turn-banner__label">Waiting…</div>
    <div id="turn-indicator" class="turn-banner__sub badge badge--muted">Waiting for your turn…</div>
  </div>

  <div id="guess-result" class="guess-result hidden" aria-live="polite"></div>

  <div id="guess-composer" class="card hidden">
    <div class="card-head">
      <h3>Guess the value</h3>
      <span class="badge badge--muted" id="guess-target-label"></span>
    </div>
    <div id="guess-options" class="value-grid"></div>
    <div class="value-grid__divider"><span>or</span></div>
    <div id="guess-yellow-row" class="value-grid__yellow"></div>
    <button id="guess-cancel" class="btn-secondary">Cancel</button>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>Your wires</h3>
      <span class="badge badge--muted" id="hand-count-badge">—</span>
    </div>
    <div id="hand" class="hand hand--tiles"></div>
    <button id="solo-btn" class="btn-primary hidden"></button>
    <button id="reveal-red-btn" class="btn-reveal hidden">Reveal red wires</button>
    <div id="equipment-actions" class="equipment-actions"></div>
    <div id="hint-actions" class="hint-actions"></div>
  </div>

  <div class="card" id="hints-card">
    <div class="card-head">
      <h3>Hints</h3>
      <span class="badge badge--muted">Blue only</span>
    </div>
    <div id="hints-list" class="hints-list"></div>
    <p class="muted" style="font-size:0.8rem; margin:0.4rem 0 0;">One factual blue hint per player, same order as turns. Wrong guesses add <em>was</em> hints for the target only.</p>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>Guess a teammate's wire</h3>
    </div>
    <p class="muted">Tap a teammate's slot, then pick the value.</p>
    <div id="targets" class="targets"></div>
  </div>

  <div id="status" class="banner hidden"></div>
</main>

<script type="module" src="js/player.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
