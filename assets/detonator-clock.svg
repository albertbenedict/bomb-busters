<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 6 segments with colors matching the new image -->
  <!-- Segment 0: top (12 o'clock) - peach/orange with 2 cats -->
  <path d="M 50 50 L 50 2 A 48 48 0 0 1 91.5 26 Z" fill="#FFB88C" stroke="#1a1a1a" stroke-width="0.7"/>
  <!-- Segment 1: top right (60deg) - yellow with 3 cats -->
  <path d="M 50 50 L 91.5 26 A 48 48 0 0 1 91.5 74 Z" fill="#FFD966" stroke="#1a1a1a" stroke-width="0.7"/>
  <!-- Segment 2: bottom right (120deg) - light green with 4 cats -->
  <path d="M 50 50 L 91.5 74 A 48 48 0 0 1 50 98 Z" fill="#C5E86C" stroke="#1a1a1a" stroke-width="0.7"/>
  <!-- Segment 3: bottom (180deg) - green with 5 cats -->
  <path d="M 50 50 L 50 98 A 48 48 0 0 1 8.5 74 Z" fill="#4CAF50" stroke="#1a1a1a" stroke-width="0.7"/>
  <!-- Segment 4: bottom left (240deg) - reddish orange with 1 cat -->
  <path d="M 50 50 L 8.5 74 A 48 48 0 0 1 8.5 26 Z" fill="#E05A2E" stroke="#1a1a1a" stroke-width="0.7"/>
  <!-- Segment 5: top left (300deg) - red with skull -->
  <path d="M 50 50 L 8.5 26 A 48 48 0 0 1 50 2 Z" fill="#D32F2F" stroke="#1a1a1a" stroke-width="0.7"/>
  <!-- Inner white circle -->
  <circle cx="50" cy="50" r="9" fill="white" stroke="#1a1a1a" stroke-width="1.2"/>
</svg>