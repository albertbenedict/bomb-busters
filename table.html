<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bomb Busters — table</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="table-page">
<nav>
  <span class="display nav-brand"><span class="nav-dot" aria-hidden="true"></span> Bomb Busters</span>
  <button class="toggle" id="theme-toggle" aria-label="Toggle theme">Dark mode</button>
</nav>

<main class="table-board">
  <!-- Top: 5 equipment slots (always 5, per your note) -->
  <section class="board-equipment" aria-label="Equipment">
    <div id="equipment-pool" class="equipment-pool equipment-pool--board"></div>
  </section>

  <!-- Room code bar (long white) -->
  <section class="board-code card center room-share">
    <p class="muted" style="margin-bottom:0.35rem;">Share this room code</p>
    <div class="room-code-wrap">
      <div class="room-code" id="room-code">----</div>
      <button id="copy-code-btn" class="btn-copy" aria-label="Copy room code" title="Copy code">⧉ Copy</button>
    </div>
    <p id="table-error" class="form-error hidden" style="margin-top:0.75rem; justify-content:center; flex-direction:column;"></p>
    <p id="table-conn" class="muted" style="font-size:0.82rem; margin-top:0.5rem; display:flex; align-items:center; justify-content:center; gap:0.4rem;"><span id="table-conn-dot" style="width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;"></span><span id="table-conn-text">Connecting…</span></p>
  </section>

  <!-- Central area: 5 players around bomb + tracker (per your 5P layout) -->
  <section class="board-center">
    <!-- Left column: 2 players -->
    <div class="board-players board-players--left">
      <div class="board-player-slot" data-slot="0"></div>
      <div class="board-player-slot" data-slot="2"></div>
    </div>

    <!-- Middle: tracker (top) + 5th player (when 5P) + bomb (center) -->
    <div class="board-middle">
      <div class="board-tracker card">
        <div class="card-head" style="margin-bottom:0.4rem;">
          <h3 style="font-size:0.95rem;">Wire Tracker</h3>
          <span class="badge badge--muted">Board</span>
        </div>
        <div id="wire-tracker" class="wire-tracker wire-tracker--dots"></div>
      </div>

      <!-- 5th player — centered above bomb when 5P, per your layout -->
      <div class="board-player-slot board-player-slot--center hidden" data-slot="4"></div>

      <div class="board-bomb">
        <div class="bomb-graphic" aria-hidden="true">
          <div class="bomb-sticks">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="bomb-fuse">◉</div>
          <div class="bomb-dial" id="bomb-dial">
            <div class="bomb-dial__label" id="detonator">0 / 0</div>
            <div id="detonator-meter" class="detonator-meter detonator-meter--dial" aria-hidden="true"></div>
            <div class="badge badge--muted" id="detonator-badge" style="margin-top:0.35rem;">Safe</div>
          </div>
        </div>
        <div id="detonator-label" class="muted" style="font-size:0.8rem; margin-top:0.4rem; text-align:center;"></div>
      </div>
    </div>

    <!-- Right column: 2 players -->
    <div class="board-players board-players--right">
      <div class="board-player-slot" data-slot="1"></div>
      <div class="board-player-slot" data-slot="3"></div>
    </div>
  </section>

  <!-- Hidden original team list for JS fallback / accessibility — rendered into slots -->
  <section class="card hidden" aria-hidden="true">
    <ul id="players"></ul>
    <span id="lobby-badge" class="hidden"></span>
    <p id="lobby-hint" class="hidden"></p>
  </section>

  <!-- Bottom: hints + status -->
  <section class="board-bottom">
    <div class="card">
      <div class="card-head">
        <h3>Hints</h3>
        <span class="badge badge--muted" id="hints-badge">Factual</span>
      </div>
      <div id="hints-pool" class="hints-pool"></div>
      <p class="muted" style="font-size:0.8rem; margin:0.4rem 0 0;">One blue hint per player, same order as turns. Wrong guesses also reveal as <em>was</em> hints.</p>
    </div>
  </section>

  <!-- Stats hidden but kept for JS (cut counts) -->
  <div class="hidden" aria-hidden="true">
    <span id="cut-count">0</span><span id="yellow-count">0</span><span id="red-count">0</span>
  </div>

  <div class="board-actions">
    <button id="start-btn" class="btn-primary hidden">Start game</button>
    <div class="host-controls" aria-label="Host controls">
      <button id="reset-btn" class="btn-secondary btn-host hidden">↺ Reset to lobby</button>
      <button id="end-btn" class="btn-ghost hidden">End session</button>
    </div>
    <p id="host-hint" class="muted hidden" style="margin-top:0.5rem; font-size:0.8rem;">Reset keeps players but clears wires. End deletes the room.</p>
    <div id="status" class="banner hidden"></div>
  </div>
</main>

<script type="module" src="js/table.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
